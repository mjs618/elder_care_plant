version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16     # PostgreSQL 16 with pgvector pre-installed
    container_name: eldercare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: elder_care
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/initdb:/docker-entrypoint-initdb.d   # SQL init scripts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: eldercare_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RabbitMQ (Event Bus) ─────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: eldercare_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP 端口
      - "15672:15672"  # 管理界面端口
    environment:
      RABBITMQ_DEFAULT_USER: eldercare
      RABBITMQ_DEFAULT_PASS: eldercare123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eldercare_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/elder_care
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://eldercare:eldercare123@rabbitmq:5672/
      APP_ENV: development
      SECRET_KEY: dev-secret-key-CHANGE-IN-PRODUCTION
      JWT_SECRET_KEY: dev-jwt-key-CHANGE-IN-PRODUCTION
      SUPERADMIN_PASSWORD: AdminPass123!
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app   # Hot-reload in development
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --reload

  # ── pgAdmin (optional dev tool) ─────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: eldercare_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@eldercare.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - tools    # Only start with: docker compose --profile tools up

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
