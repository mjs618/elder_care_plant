name: Module CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/modules/**'
      - 'backend/contracts/**'
      - 'backend/shared/**'
      - '.github/workflows/modules.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/modules/**'
      - 'backend/contracts/**'
      - 'backend/shared/**'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      patient_mgmt: ${{ steps.filter.outputs.patient_mgmt }}
      assessment: ${{ steps.filter.outputs.assessment }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            patient_mgmt:
              - 'backend/modules/patient_mgmt/**'
              - 'backend/contracts/patient_contract.py'
            assessment:
              - 'backend/modules/assessment/**'
              - 'backend/contracts/assessment_contract.py'
            contracts:
              - 'backend/contracts/**'
              - 'backend/shared/**'

  lint-and-test:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.patient_mgmt == 'true' || needs.detect-changes.outputs.assessment == 'true' || needs.detect-changes.outputs.contracts == 'true'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio pytest-cov
      
      - name: Run Ruff linting
        run: |
          cd backend
          ruff check modules/ contracts/ shared/ --output-format=github
      
      - name: Run type checking
        run: |
          cd backend
          mypy modules/ contracts/ shared/ --ignore-missing-imports
      
      - name: Run tests
        run: |
          cd backend
          pytest tests/ -v --cov=modules --cov=contracts --cov=shared --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          fail_ci_if_error: false

  build-patient-module:
    runs-on: ubuntu-latest
    needs: [detect-changes, lint-and-test]
    if: needs.detect-changes.outputs.patient_mgmt == 'true'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      
      - name: Build Patient Module Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/modules/patient_mgmt/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.CONTAINER_REGISTRY }}/patient-mgmt:latest
            ${{ secrets.CONTAINER_REGISTRY }}/patient-mgmt:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-assessment-module:
    runs-on: ubuntu-latest
    needs: [detect-changes, lint-and-test]
    if: needs.detect-changes.outputs.assessment == 'true'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      
      - name: Build Assessment Module Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/modules/assessment/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.CONTAINER_REGISTRY }}/assessment:latest
            ${{ secrets.CONTAINER_REGISTRY }}/assessment:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Build
        run: |
          cd frontend
          npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-patient-module, build-assessment-module, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add deployment commands here

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-patient-module, build-assessment-module, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add deployment commands here
